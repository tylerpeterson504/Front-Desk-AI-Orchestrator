name: Generate Lock Files

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: generate-lock-files
  cancel-in-progress: true

jobs:
  generate-lock-files:
    name: Generate and commit lock files
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Install dependencies
        env:
          HUSKY: "0"
        run: npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts
        timeout-minutes: 15

      - name: Check for changes
        id: verify_changes
        run: |
          git add package-lock.json
          if [ -n "$(git diff --cached --name-only)" ]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit lock files
        if: steps.verify_changes.outputs.changes == 'true'
        run: |
          git commit -m "chore: update lock files [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}