name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          backend/package-lock.json
          dashboard/package-lock.json
    - name: Install dependencies
      env:
        HUSKY: "0"
      run: |
        set -o pipefail
        install() {
          dir="$1"
          log="/tmp/npm-ci-$(echo "$dir" | tr '/' '-').log"
          if ! (cd "$dir" && npm ci --no-audit --no-fund --ignore-scripts 2>&1 | tee "$log"); then
            echo "::error::npm ci failed in $dir: $(grep -iE 'error|ERESOLVE|EBADENGINE|E404|ENOENT|EUSAGE' "$log" | head -5 | tr '\n' ' | ')"
            exit 1
          fi
        }
        install .
        install backend
        install dashboard
    - name: Build backend
      run: npm run build:backend
    - name: Build dashboard
      run: npm run build:dashboard
      env:
        CI: true
        NODE_ENV: production
