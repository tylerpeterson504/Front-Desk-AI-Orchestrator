name: Create/Delete Branch for Pull Request

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

# Least privilege by default. Neon branches are managed through NEON_API_KEY,
# not the GitHub token, so read access to the checkout is all any job needs.
permissions:
  contents: read

env:
  NEON_BRANCH_NAME: preview-pr-${{ github.event.number }}

jobs:
  prepare_neon_branch:
    name: Prepare Neon Branch
    if: |
      github.event_name == 'pull_request' && (
      github.event.action == 'synchronize'
      || github.event.action == 'opened'
      || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    steps:
      - name: Get branch expiration date as an env variable (2 weeks from now)
        id: get_expiration_date
        run: echo "EXPIRES_AT=$(date -u --date '+14 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Debug - Show branch details
        run: |
          echo "Branch name to create: ${{ env.NEON_BRANCH_NAME }}"
          echo "Project ID: ${{ vars.NEON_PROJECT_ID }}"
          echo "API Key is set: ${{ secrets.NEON_API_KEY != '' && 'yes' || 'no' }}"

      - name: Reset existing Neon Branch
        if: github.event.action != 'opened'
        id: reset_neon_branch
        continue-on-error: true
        uses: neondatabase/reset-branch-action@v1
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ env.NEON_BRANCH_NAME }}
          parent: true
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Create Neon Branch
        if: steps.reset_neon_branch.outcome != 'success'
        id: create_neon_branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ${{ env.NEON_BRANCH_NAME }}
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ env.EXPIRES_AT }}

      # Run schema migrations against the fresh PR branch (unpooled connection).
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Run Migrations
        working-directory: backend
        run: npm ci && npm run migrate
        env:
          # to use unpooled connection (recommended for migrations)
          DATABASE_URL: "${{ steps.reset_neon_branch.outputs.db_url || steps.create_neon_branch.outputs.db_url }}"


  delete_neon_branch:
    name: Delete Neon Branch
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete Neon Branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ env.NEON_BRANCH_NAME }}
          api_key: ${{ secrets.NEON_API_KEY }}
