name: Create/Delete Branch for Pull Request

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

# Least privilege by default. Neon branches are managed through NEON_API_KEY,
# not the GitHub token, so read access to the checkout is all any job needs.
permissions:
  contents: read

env:
  NEON_BRANCH_NAME: preview-pr-${{ github.event.number }}

jobs:
  prepare_neon_branch:
    name: Prepare Neon Branch
    if: |
      github.event_name == 'pull_request' && (
      github.event.action == 'synchronize'
      || github.event.action == 'opened'
      || github.event.action == 'reopened')
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Get branch expiration date as an env variable (2 weeks from now)
        id: get_expiration_date
        run: echo "EXPIRES_AT=$(date -u --date '+14 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Debug - Show branch details
        run: |
          echo "Branch name to create: ${{ env.NEON_BRANCH_NAME }}"
          echo "Project ID: ${{ vars.NEON_PROJECT_ID }}"
          echo "API Key is set: ${{ secrets.NEON_API_KEY != '' && 'yes' || 'no' }}"

      - name: Create or reuse Neon Branch
        id: create_neon_branch
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ${{ env.NEON_BRANCH_NAME }}
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ env.EXPIRES_AT }}

      # This Neon project defines multiple roles (neondb_owner, authenticator,
      # anonymous, authenticated), which reset-branch-action cannot disambiguate
      # and fails on. To guarantee fresh parent data on synchronize, delete the
      # stale branch and recreate it from the parent instead of resetting it.
      - name: Delete stale branch on synchronize
        if: github.event.action == 'synchronize' && steps.create_neon_branch.outputs.created != 'true'
        id: delete_neon_branch
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ env.NEON_BRANCH_NAME }}
          api_key: ${{ secrets.NEON_API_KEY }}
      - name: Recreate branch from parent on synchronize
        if: github.event.action == 'synchronize' && steps.create_neon_branch.outputs.created != 'true'
        id: recreate_neon_branch
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ${{ env.NEON_BRANCH_NAME }}
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ env.EXPIRES_AT }}

      # Run schema migrations against the fresh PR branch (unpooled connection).
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Run Migrations
        working-directory: backend
        run: npm ci && npm run migrate
        env:
          # to use unpooled connection (recommended for migrations)
          DATABASE_URL: "${{ steps.recreate_neon_branch.outputs.db_url || steps.create_neon_branch.outputs.db_url }}"
          JWT_SECRET: ci-only-secret-not-for-production


  delete_neon_branch:
    name: Delete Neon Branch
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Delete Neon Branch
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ env.NEON_BRANCH_NAME }}
          api_key: ${{ secrets.NEON_API_KEY }}
