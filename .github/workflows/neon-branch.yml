name: Create/Delete Branch for Pull Request

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

# Least privilege by default. Neon branches are managed through NEON_API_KEY,
# not the GitHub token, so read access to the checkout is all any job needs.
permissions:
  contents: read

jobs:
  setup:
    name: Setup
    outputs:
      branch: ${{ steps.branch_name.outputs.current_branch }}
      branch_safe: ${{ steps.sanitize_branch.outputs.branch_safe }}
    runs-on: ubuntu-latest
    steps:
      - name: Get branch name
        id: branch_name
        uses: tj-actions/branch-names@v8

      - name: Sanitize branch name for Neon
        id: sanitize_branch
        shell: bash
        env:
          BRANCH_NAME: ${{ steps.branch_name.outputs.current_branch }}
        run: |
          branch_name="${BRANCH_NAME//[!A-Za-z0-9_-]/-}"
          echo "branch_safe=${branch_name:0:40}" >> "$GITHUB_OUTPUT"

  create_neon_branch:
    name: Create Neon Branch
    outputs:
      db_url: ${{ steps.create_neon_branch_encode.outputs.db_url }}
      db_url_with_pooler: ${{ steps.create_neon_branch_encode.outputs.db_url_with_pooler }}
    needs: setup
    if: |
      github.event_name == 'pull_request' && (
      github.event.action == 'synchronize'
      || github.event.action == 'opened'
      || github.event.action == 'reopened')
    runs-on: ubuntu-latest
    steps:
      - name: Get branch expiration date as an env variable (2 weeks from now)
        id: get_expiration_date
        run: echo "EXPIRES_AT=$(date -u --date '+14 days' +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Create Neon Branch
        id: create_neon_branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: preview-pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ env.EXPIRES_AT }}

      # Re-encode the connection strings into step outputs safely (no logging).
      - name: Encode connection strings as outputs
        id: create_neon_branch_encode
        run: |
          echo "db_url=$(echo '${{ steps.create_neon_branch.outputs.db_url }}' | base64 -w0)" >> "$GITHUB_OUTPUT"
          echo "db_url_with_pooler=$(echo '${{ steps.create_neon_branch.outputs.db_url_with_pooler }}' | base64 -w0)" >> "$GITHUB_OUTPUT"

      # Run schema migrations against the fresh PR branch (unpooled connection).
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Run Migrations
        working-directory: backend
        run: npm ci && npm run migrate
        env:
          # to use unpooled connection (recommended for migrations)
          DATABASE_URL: "${{ steps.create_neon_branch.outputs.db_url }}"


  delete_neon_branch:
    name: Delete Neon Branch
    needs: setup
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete Neon Branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview-pr-${{ github.event.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
