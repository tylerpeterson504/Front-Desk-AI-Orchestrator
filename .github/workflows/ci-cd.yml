name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd backend
          npm ci
          cd ../dashboard
          npm ci
          cd ../extension
          npm ci

      - name: Run ESLint
        run: |
          cd backend
          npm run lint
          cd ../dashboard
          npm run lint

  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd backend
          npm ci
          cd ../dashboard
          npm ci
          cd ../extension
          npm ci

      - name: Run TypeScript type checking
        run: |
          cd backend
          npm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd backend
          npm ci

      - name: Run tests
        run: |
          cd backend
          npm run test
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret
          DATABASE_URL: postgres://user:pass@localhost:5432/test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd backend
          npm ci
          cd ../dashboard
          npm ci

      - name: Build backend
        run: |
          cd backend
          npm run build

      - name: Build dashboard
        run: |
          cd dashboard
          npm run build

      - name: Build extension
        run: |
          cd extension
          npm run build

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          cd backend
          npm ci

      - name: Deploy to production
        run: echo "Add your deployment commands here"
        # Example: npm run deploy
