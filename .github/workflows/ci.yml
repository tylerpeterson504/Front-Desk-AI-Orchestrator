name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: read
  issues: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        env:
          HUSKY: "0"
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts
          cd backend && npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts
          cd ../dashboard && npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts
        timeout-minutes: 15

      - name: TypeScript type check
        run: |
          set +e
          npm run typecheck > /tmp/typecheck.log 2>&1
          status=$?
          cat /tmp/typecheck.log
          if [ $status -ne 0 ]; then
            git config user.name "ci-debug"
            git config user.email "ci-debug@users.noreply.github.com"
            git fetch origin fix/ci-typecheck-corruption
            git checkout FETCH_HEAD
            mkdir -p .ci-debug
            cp /tmp/typecheck.log .ci-debug/typecheck.log
            git add -f .ci-debug
            git commit -m "ci: attach typecheck log [skip ci]"
            git push origin HEAD:refs/heads/ci-debug-log || echo "::error::failed to push typecheck log"
          fi
          exit $status

      - name: Lint
        run: npm run lint || true

      - name: Test backend
        run: npm run test:backend
        env:
          JWT_SECRET: ci-only-secret-not-for-production
          NODE_ENV: test
          CI: "true"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        env:
          HUSKY: "0"
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts
          cd backend && npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts
          cd ../dashboard && npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts
        timeout-minutes: 15

      - name: Build backend
        run: npm run build:backend

      - name: Build dashboard
        run: npm run build:dashboard
        env:
          CI: true
          NODE_ENV: production
