name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  test:
    name: Test ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [backend, extension, dashboard]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: npm install --no-audit --no-fund

      - name: TypeScript type check
        working-directory: ${{ matrix.package }}
        run: npx tsc --noEmit || true

      - name: Lint
        working-directory: ${{ matrix.package }}
        run: npm run lint || true

      - name: Test
        working-directory: ${{ matrix.package }}
        run: |
          npm test 2>&1 | tee /tmp/test-output.log
          exit ${PIPESTATUS[0]}
        env:
          JWT_SECRET: ci-only-secret-not-for-production
          NODE_ENV: test

      - name: Report test failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Test output for ${{ matrix.package }}:"
            echo ""
            echo "```"
            tail -c 60000 /tmp/test-output.log 2>/dev/null || echo "No output captured"
            echo "```"
          } > /tmp/issue-body.md
          gh issue create \
            --repo ${{ github.repository }} \
            --title "CI Test Failure: ${{ matrix.package }}" \
            --body-file /tmp/issue-body.md 2>&1 || \
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -d "{\"title\":\"CI Test Failure: ${{ matrix.package }}\",\"body\":$(jq -Rs . < /tmp/issue-body.md)}" \
            https://api.github.com/repos/${{ github.repository }}/issues || true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install all dependencies
        run: npm install --no-audit --no-fund

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build
        env:
          CI: true
          NODE_ENV: production

      - name: Build extension
        working-directory: extension
        run: npm run build || true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install all dependencies
        run: npm install --no-audit --no-fund

      - name: Audit dependencies
        run: |
          for pkg in backend dashboard extension; do
            echo "Auditing $pkg..."
            npm --prefix $pkg audit --audit-level=high || true
          done