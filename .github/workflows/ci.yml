name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: read
  issues: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        env:
          HUSKY: "0"
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          cd backend && npm ci --no-audit --no-fund --ignore-scripts
          cd ../dashboard && npm ci --no-audit --no-fund --ignore-scripts
        timeout-minutes: 15

      - name: TypeScript type check
        run: |
          set +e
          npm run typecheck > /tmp/typecheck.log 2>&1
          status=$?
          cat /tmp/typecheck.log
          exit $status

      - name: Extension type check
        run: cd extension && npm ci --no-audit --no-fund --ignore-scripts && npm run typecheck
      - name: Lint
        run: npm run lint || true

      - name: Test backend
        run: |
          set +e
          set -o pipefail
          npm run test:backend 2>&1 | tee /tmp/backend-test.log
          status=$?
          exit $status
        env:
          JWT_SECRET: ci-only-secret-not-for-production
          MISTRAL_API_KEY: ci-dummy-key-not-used-by-tests
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          NODE_ENV: test
          CI: "true"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        env:
          HUSKY: "0"
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          cd backend && npm ci --no-audit --no-fund --ignore-scripts
          cd ../dashboard && npm ci --no-audit --no-fund --ignore-scripts
        timeout-minutes: 15

      - name: Build backend
        run: npm run build:backend

      - name: Build dashboard
        run: npm run build:dashboard
        env:
          CI: true
          NODE_ENV: production
