name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  test:
    name: Test ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [backend, extension, dashboard]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        timeout-minutes: 15
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: TypeScript type check
        working-directory: ${{ matrix.package }}
        run: npx tsc --noEmit || true

      - name: Lint
        working-directory: ${{ matrix.package }}
        run: npm run lint || true

      - name: Test
        working-directory: ${{ matrix.package }}
        run: |
          npm test 2>&1 | tee /tmp/test-output.log
          exit ${PIPESTATUS[0]}
        env:
          JWT_SECRET: ci-only-secret-not-for-production
          NODE_ENV: test

      - name: Report test failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Test output for ${{ matrix.package }}:" > /tmp/issue-body.md
          tail -c 60000 /tmp/test-output.log 2>/dev/null >> /tmp/issue-body.md || echo "No test output found" >> /tmp/issue-body.md
          jq -n --arg body "$(cat /tmp/issue-body.md)" --arg title "CI Test Failure: ${{ matrix.package }}" '{title: $title, body: $body}' > /tmp/issue-payload.json
          curl -s -X POST             -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}"             -H "Accept: application/vnd.github+json"             -d @/tmp/issue-payload.json             https://api.github.com/repos/${{ github.repository }}/issues || true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install all dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build
        env:
          CI: true
          NODE_ENV: production

      - name: Build extension
        working-directory: extension
        run: npm run build || true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install all dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Audit dependencies
        run: |
          for pkg in backend dashboard extension; do
            echo "Auditing $pkg..."
            npm --prefix $pkg audit --audit-level=high || true
          done
