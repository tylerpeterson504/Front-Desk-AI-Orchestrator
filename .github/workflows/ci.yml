name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Test ${{ matrix.package }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        package: [backend, extension, dashboard]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: npm ci

      - name: TypeScript type check
        working-directory: ${{ matrix.package }}
        run: npx tsc --noEmit || true

      - name: Lint
        working-directory: ${{ matrix.package }}
        run: npm run lint || true

      - name: Test
        working-directory: ${{ matrix.package }}
        run: |
          set -o pipefail
          npm test 2>&1 | tee "/tmp/test-output-${{ matrix.package }}.txt"
        env:
          JWT_SECRET: ci-only-secret-not-for-production
          NODE_ENV: test
          NO_COLOR: "1"

      - name: Report test output
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          file="/tmp/test-output-${{ matrix.package }}.txt"
          if [ ! -s "$file" ]; then exit 0; fi
          tail -c 60000 "$file" > /tmp/issue-body.txt
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "CI test failures: ${{ matrix.package }} @ ${GITHUB_SHA::7}" \
            --body-file /tmp/issue-body.txt || true

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install all dependencies
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Build dashboard
        working-directory: dashboard
        run: npm run build
        env:
          CI: true
          NODE_ENV: production

      - name: Build extension
        working-directory: extension
        run: npm run build || true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install all dependencies
        run: npm ci

      - name: Audit dependencies
        run: |
          for pkg in backend dashboard extension; do
            echo "Auditing $pkg..."
            npm --prefix $pkg audit --audit-level=high || true
          done