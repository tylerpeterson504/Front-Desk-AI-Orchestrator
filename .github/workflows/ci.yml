name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: read
  issues: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        env:
          HUSKY: "0"
        run: |
          exec > >(tee /tmp/install.log) 2>&1
          npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts
          cd backend && npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts
          cd ../dashboard && npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts
        timeout-minutes: 15

      - name: TypeScript type check
        run: |
          set +e
          npm run typecheck > /tmp/typecheck.log 2>&1
          status=$?
          cat /tmp/typecheck.log
          exit $status

      - name: Lint
        run: npm run lint || true

      - name: Test backend
        run: npm run test:backend
        env:
          JWT_SECRET: ci-only-secret-not-for-production
          NODE_ENV: test
          CI: "true"

      - name: Attach debug logs on failure
        if: failure()
        run: |
          git config user.name "ci-debug"
          git config user.email "ci-debug@users.noreply.github.com"
          git fetch origin ${{ github.head_ref || github.ref_name }}
          git checkout FETCH_HEAD
          mkdir -p .ci-debug
          if [ -f /tmp/install.log ]; then cp /tmp/install.log .ci-debug/; fi
          if [ -f /tmp/typecheck.log ]; then cp /tmp/typecheck.log .ci-debug/; fi
          git add -f .ci-debug
          git commit -m "ci: attach debug logs [skip ci]"
          git push origin HEAD:refs/heads/ci-debug-log-${{ github.run_id }} --force || echo "::error::failed to push debug logs"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        env:
          HUSKY: "0"
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts
          cd backend && npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts
          cd ../dashboard && npm install --legacy-peer-deps --no-audit --no-fund --ignore-scripts
        timeout-minutes: 15

      - name: Build backend
        run: npm run build:backend

      - name: Build dashboard
        run: npm run build:dashboard
        env:
          CI: true
          NODE_ENV: production
