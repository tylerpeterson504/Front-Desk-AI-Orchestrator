name: Port CI fixes v2

on:
  push:
    branches: [vibe/ext-test-debug]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vibe/fix-ci-v2
          fetch-depth: 0
      - name: Port extension jsdom files
        run: |
          git fetch origin vibe/dashboard-lockfile-sync-b4377a
          git checkout origin/vibe/dashboard-lockfile-sync-b4377a -- \
            extension/package.json \
            extension/package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(extension): add jsdom devDependency and synced lockfile so vitest jsdom environment resolves"
          git push "https://x-access-token:${{ github.token }}@github.com/tylerpeterson504/Front-Desk-AI-Orchestrator.git" HEAD:vibe/fix-ci-v2
