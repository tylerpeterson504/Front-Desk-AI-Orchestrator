name: Port CI fixes

on:
  push:
    branches: [vibe/ext-test-debug]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Port verified files from lockfile-sync branch
        run: |
          git fetch origin vibe/dashboard-lockfile-sync-b4377a
          git checkout origin/vibe/dashboard-lockfile-sync-b4377a -- \
            dashboard/package-lock.json \
            extension/tests/sidepanel.test.ts \
            backend/tests/services.test.ts
          git checkout -b vibe/fix-ci-v2
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(ci): port regenerated dashboard lockfile and verified test repairs from lockfile-sync branch"
          git push "https://x-access-token:${{ github.token }}@github.com/tylerpeterson504/Front-Desk-AI-Orchestrator.git" vibe/fix-ci-v2
