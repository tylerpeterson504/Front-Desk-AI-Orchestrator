name: Ext jsdom fix

on:
  push:
    branches: [vibe/ext-test-debug]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vibe/dashboard-lockfile-sync-b4377a
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Add jsdom to extension devDependencies
        run: |
          cd extension
          npm install --save-dev jsdom@24.1.3 --no-audit --no-fund --ignore-scripts
          npm ls jsdom || true
      - name: Verify tests run
        run: |
          cd extension
          set +e
          npx vitest run > /tmp/ext.log 2>&1
          code=$?
          tail -40 /tmp/ext.log
          echo "vitest exit=$code" >> /tmp/ext.log
      - name: Push updated lockfiles to PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd extension
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(extension): add jsdom devDependency so vitest jsdom environment resolves" || echo "nothing to commit"
          git push "https://x-access-token:${{ github.token }}@github.com/tylerpeterson504/Front-Desk-AI-Orchestrator.git" HEAD:vibe/dashboard-lockfile-sync-b4377a
      - name: Publish test log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          B64=$(base64 -w0 /tmp/ext.log)
          curl -s -X PUT -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/tylerpeterson504/Front-Desk-AI-Orchestrator/contents/debug-ext-test.log -d "{\"message\":\"debug log after jsdom fix\",\"branch\":\"vibe/ext-test-debug\",\"content\":\"$B64\"}" > /tmp/put.json
          grep -q '"sha"' /tmp/put.json && echo published
