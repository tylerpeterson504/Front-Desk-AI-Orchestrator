<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Qwen3-32B Chat Demo</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #161a23;
    --border: #2a3040;
    --text: #e7e9ee;
    --muted: #8b93a7;
    --accent: #6c8cff;
    --user: #24304d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 16px 24px; border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  }
  header h1 { font-size: 18px; margin: 0; }
  header a { color: var(--accent); text-decoration: none; }
  header .sub { color: var(--muted); font-size: 13px; }
  #tokenbar {
    display: flex; gap: 8px; padding: 12px 24px; border-bottom: 1px solid var(--border);
    background: var(--panel); align-items: center; flex-wrap: wrap;
  }
  #tokenbar label { color: var(--muted); font-size: 13px; }
  #token {
    flex: 1; min-width: 240px; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: 14px;
  }
  #tokenbar button {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: 8px 16px; font-size: 14px; cursor: pointer;
  }
  #tokenbar .status { font-size: 13px; color: var(--muted); }
  #chat {
    flex: 1; overflow-y: auto; padding: 24px;
    display: flex; flex-direction: column; gap: 12px; max-width: 860px; width: 100%; margin: 0 auto;
  }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--user); }
  .msg.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); }
  .msg .role { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
  footer {
    border-top: 1px solid var(--border); padding: 12px 24px;
    display: flex; gap: 8px; max-width: 860px; width: 100%; margin: 0 auto;
  }
  #prompt {
    flex: 1; background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; font-size: 15px;
  }
  #send {
    background: var(--accent); color: #fff; border: 0; border-radius: 10px;
    padding: 10px 20px; font-size: 15px; cursor: pointer;
  }
  #send:disabled { opacity: 0.5; cursor: wait; }
  .thinking-row { display: flex; gap: 10px; align-items: center; padding: 0 24px 8px; max-width: 860px; margin: 0 auto; width: 100%; }
  .thinking-row label { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>💬 Qwen3-32B Chat Demo</h1>
  <span class="sub">Static Space · calls <a href="https://huggingface.co/Qwen/Qwen3-32B" target="_blank" rel="noopener">Qwen/Qwen3-32B</a> via the HF Inference API</span>
</header>

<div id="tokenbar">
  <label for="token">HF token</label>
  <input id="token" type="password" placeholder="hf_... (stored in this browser only, never sent anywhere else)" />
  <button id="saveToken">Save</button>
  <span class="status" id="tokenStatus"></span>
</div>

<div id="chat"></div>

<div class="thinking-row">
  <input type="checkbox" id="thinking" />
  <label for="thinking">Enable Qwen3 thinking mode (enable_thinking)</label>
</div>

<footer>
  <input id="prompt" placeholder="Ask Qwen3-32B anything…" autocomplete="off" />
  <button id="send">Send</button>
</footer>

<script>
  const MODEL_ID = "Qwen/Qwen3-32B";
  const API_URL = "https://router.huggingface.co/v1/chat/completions";

  const tokenInput = document.getElementById("token");
  const tokenStatus = document.getElementById("tokenStatus");
  const chat = document.getElementById("chat");
  const promptInput = document.getElementById("prompt");
  const sendBtn = document.getElementById("send");
  const thinkingBox = document.getElementById("thinking");

  const savedToken = localStorage.getItem("hf_demo_token");
  if (savedToken) {
    tokenInput.value = savedToken;
    tokenStatus.textContent = "token loaded from this browser";
  }

  document.getElementById("saveToken").addEventListener("click", () => {
    localStorage.setItem("hf_demo_token", tokenInput.value.trim());
    tokenStatus.textContent = tokenInput.value.trim() ? "token saved in this browser" : "token cleared";
  });

  function addMessage(role, text) {
    const div = document.createElement("div");
    div.className = "msg " + role;
    const roleLabel = document.createElement("span");
    roleLabel.className = "role";
    roleLabel.textContent = role === "user" ? "You" : MODEL_ID;
    const body = document.createElement("div");
    body.className = "body";
    body.textContent = text;
    div.appendChild(roleLabel);
    div.appendChild(body);
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return body;
  }

  const history = [];

  async function sendMessage() {
    const text = promptInput.value.trim();
    const token = tokenInput.value.trim();
    if (!text || sendBtn.disabled) return;
    if (!token) {
      addMessage("assistant", "⚠️ Add a Hugging Face token above first — it stays in your browser and is used only to call the Inference API.");
      return;
    }

    promptInput.value = "";
    addMessage("user", text);
    history.push({ role: "user", content: text });

    const bodyEl = addMessage("assistant", "…");
    sendBtn.disabled = true;
    sendBtn.textContent = "…";

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + token,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          model: MODEL_ID,
          messages: history,
          stream: true,
          max_tokens: 1024,
          temperature: 0.6,
          chat_template_kwargs: { enable_thinking: thinkingBox.checked }
        })
      });

      if (!res.ok) {
        const detail = await res.text().catch(() => "");
        throw new Error("HTTP " + res.status + (detail ? " — " + detail.slice(0, 300) : ""));
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let full = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop();
        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed.startsWith("data:")) continue;
          const data = trimmed.slice(5).trim();
          if (data === "[DONE]") continue;
          try {
            const json = JSON.parse(data);
            const delta = json.choices?.[0]?.delta?.content || "";
            full += delta;
            bodyEl.textContent = full;
            chat.scrollTop = chat.scrollHeight;
          } catch (_) { /* partial JSON line, ignore */ }
        }
      }

      if (!full.trim()) full = "(empty response)";
      bodyEl.textContent = full;
      history.push({ role: "assistant", content: full });
    } catch (err) {
      bodyEl.textContent = "⚠️ " + err.message;
    } finally {
      sendBtn.disabled = false;
      sendBtn.textContent = "Send";
      promptInput.focus();
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  promptInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
</script>
</body>
</html>
