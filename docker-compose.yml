services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: frontdesk-postgres
    environment:
      POSTGRES_USER: frontdesk
      POSTGRES_PASSWORD: frontdesk123
      POSTGRES_DB: frontdesk_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frontdesk -d frontdesk_ai"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - frontdesk-network

  # Backend API Server (source mounted at /app/backend, matching Dockerfile)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: frontdesk-backend
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://frontdesk:frontdesk123@postgres:5432/frontdesk_ai
      # Override these in .env or the shell for anything beyond local dev
      JWT_SECRET: ${JWT_SECRET:-change_me_local_dev_only}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      WIFI_ENCRYPTION_KEY: ${WIFI_ENCRYPTION_KEY:-change_me_local_dev_only}
      CORS_ORIGIN: http://localhost:5173,http://dashboard:5173
      REGISTRATION_MODE: open
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules
    command: npm run dev
    networks:
      - frontdesk-network

  # Dashboard (Vite, port 5173 matches vite.config.ts server.port)
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: frontdesk-dashboard
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:3001
    ports:
      - "5173:5173"
    volumes:
      - ./dashboard:/app/dashboard
      - /app/dashboard/node_modules
    command: npm run dev
    networks:
      - frontdesk-network

  # PGAdmin (optional database UI)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: frontdesk-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@frontdesk.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - frontdesk-network

volumes:
  postgres_data:

networks:
  frontdesk-network:
    driver: bridge
