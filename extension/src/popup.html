<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Front Desk AI</title>
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: #f8f9fa;
    }
    .popup-container {
      text-align: center;
    }
    h2 {
      color: #1e40af;
      font-size: 18px;
      margin: 0 0 8px 0;
    }
    p {
      color: #666;
      font-size: 13px;
      margin: 0 0 16px 0;
    }
    .btn {
      display: inline-block;
      background: #1e40af;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      text-decoration: none;
    }
    .btn:hover {
      background: #1e3a8a;
    }
  </style>
</head>
<body>
  <div class="popup-container">
    <h2>🏨 Desk AI</h2>
    <p>Open the sidepanel to access the Front Desk AI Copilot</p>
    <button class="btn" id="open-sidepanel">Open Sidepanel</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
