<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Front Desk AI</title>
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: #f8f9fa;
    }
    .popup-container {
      text-align: center;
    }
    h2 {
      color: #1e40af;
      font-size: 18px;
      margin: 0 0 8px 0;
    }
    p {
      color: #666;
      font-size: 13px;
      margin: 0 0 16px 0;
    }
    .btn {
      display: inline-block;
      background: #1e40af;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      text-decoration: none;
    }
    .btn:hover {
      background: #1e3a8a;
    }
    .settings {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #e5e7eb;
      text-align: left;
    }
    .settings label {
      display: block;
      color: #374151;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .settings input {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      font-size: 12px;
      margin-bottom: 8px;
    }
    .settings .btn {
      width: 100%;
    }
    .status {
      font-size: 11px;
      margin: 8px 0 0 0;
      min-height: 14px;
    }
    .status.error {
      color: #b91c1c;
    }
    .status.ok {
      color: #15803d;
    }
  </style>
</head>
<body>
  <div class="popup-container">
    <h2>🏨 Desk AI</h2>
    <p>Open the sidepanel to access the Front Desk AI Copilot</p>
    <button class="btn" id="open-sidepanel">Open Sidepanel</button>

    <div class="settings">
      <label for="api-base-url">Backend URL</label>
      <input id="api-base-url" type="url" placeholder="http://localhost:3001" spellcheck="false" />
      <button class="btn" id="save-api-base-url">Save</button>
      <p class="status" id="settings-status"></p>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
